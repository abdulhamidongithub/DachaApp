<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kurort Tizimi{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#2F4B3C; font-family:'Inter',sans-serif; padding:1rem; }
    .card { background:#F5F1E8; padding:2.5rem 2.25rem; border-radius:8px; width:100%; max-width:380px; }
    .home { display:inline-block; margin-bottom:1.25rem; font-size:0.82rem; color:#5B6660; text-decoration:none; }
    h1 { font-family:'Fraunces',serif; font-size:1.6rem; color:#1E2A25; margin:0 0 0.3rem; }
    .tag { color:#5B6660; margin:0 0 1.5rem; font-size:0.92rem; }
    label { display:block; font-size:0.85rem; color:#5B6660; margin-bottom:0.25rem; }
    input { width:100%; padding:0.6rem 0.7rem; margin-bottom:0.9rem; border:1px solid #E2DBC9;
            border-radius:6px; font-size:0.95rem; font-family:inherit; }
    input:focus { outline:2px solid #3E7C7C; outline-offset:1px; }
    .req { color:#B9483A; }
    button { width:100%; padding:0.65rem; background:#C9A05C; color:#fff; border:none;
             border-radius:6px; font-size:0.95rem; cursor:pointer; }
    button:hover { filter:brightness(0.95); }
    .field-error { color:#B9483A; font-size:0.82rem; margin:-0.6rem 0 0.8rem; }
    .errorlist { color:#B9483A; font-size:0.85rem; list-style:none; padding:0; margin:0 0 1rem; }
    .alt { margin:1.25rem 0 0; font-size:0.88rem; color:#5B6660; text-align:center; }
    .alt a { color:#2F4B3C; }
    .msg { padding:0.6rem 0.8rem; border-radius:6px; font-size:0.88rem; margin-bottom:1rem; }
    .msg.error { background:#F6E5E1; color:#B9483A; }
    .msg.success { background:#E4EEE9; color:#3E7C7C; }
    button.link { background:none; color:#2F4B3C; width:auto; padding:0; text-decoration:underline; font-size:0.88rem; }
  </style>
</head>
<body>
  <div class="card">
    <a class="home" href="{% url 'landing' %}">← Bosh sahifa</a>
    {% block card %}{% endblock %}
  </div>
</body>
</html>
