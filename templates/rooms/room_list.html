{% extends "base.html" %}

  </div>

  <div class="table-responsive">
  <table>
    <tr><th>Xona raqami</th><th>Kunlik narx</th><th></th></tr>

      <td>{{ r.number }}</td>
      <td>{{ r.price_per_night|intcomma }}</td>
      <td><a href="{% url 'room-edit' r.pk %}" class="btn btn-edit">Tahrirlash</a></td>
    </tr>
    {% endfor %}
  </table>
  </div>
{% endblock %}
